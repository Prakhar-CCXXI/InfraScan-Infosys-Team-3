server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /images/ {
        proxy_pass http://backend:8000;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
    }

    location /predictions/ {
        proxy_pass http://backend:8000;
    }

    location /inspections/ {
        proxy_pass http://backend:8000;
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}
