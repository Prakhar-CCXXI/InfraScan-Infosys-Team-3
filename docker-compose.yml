
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: my-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build: 
          context: .
          dockerfile: backend/Dockerfile
    container_name: my-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:admin@db:5432/infrascan_db

  db:
    image: postgres:16
    container_name: my-database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: infrascan_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
